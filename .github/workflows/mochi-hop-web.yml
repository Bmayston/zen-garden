name: Mochi Hop – web version (GitHub Pages)

# Publishes the game so shared challenge links can be played in any browser:
#   https://bmayston.github.io/zen-garden/play/
# The existing CSS Zen Garden page stays at the site root.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "mochi-hop/app/src/main/assets/game/**"
      - "index.html"
      - "style.css"
      - ".github/workflows/mochi-hop-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/play
          cp index.html style.css _site/
          cp -r mochi-hop/app/src/main/assets/game/. _site/play/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
